name: ab-mac-focus

on:
  push:
    branches: [ab/mac-focus]
  workflow_dispatch:

env:
  MAIN_SHA: 2808b642accf99c0a27b9667dc62f28a978c6837
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  focus:
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [driver-enables-remote-debugging]
        build: [L, P, M, N]
        typing: [on]
        prewarm: [off]
        trial: [1, 2, 3]
        exclude:
          - build: P
            trial: 3
          - build: M
            trial: 3
          - build: N
            trial: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ffmpeg jq 2>/dev/null || true
      - name: Source ${{ matrix.build }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" checkout --quiet --force "$MAIN_SHA"
          b="${{ matrix.build }}"
          crates="$src/libs/cua-driver/rust/crates"
          macos="$crates/platform-macos/src"
          patch() { perl "ab/$1" ${3:-} < "$2" > "$2.new" && mv "$2.new" "$2"; }
          if [[ ! "$b" =~ ^[AMN]$ ]]; then
            perl -0pi -e 's/fn guarded_attach_allowed\(window_on_current_space: Option<bool>\) -> bool \{\n    window_on_current_space == Some\(false\)\n\}/fn guarded_attach_allowed(_window_on_current_space: Option<bool>) -> bool {\n    true\n}/' "$macos/browser/platform.rs"
            git -C "$src" diff | grep -q "^+    true" || { echo "patch did not apply" >&2; exit 1; }
          fi
          if [[ "$b" =~ ^[CDEGHIJLP]$ ]]; then patch wait_for_ax_checkbox.pl "$macos/browser/setup_ui.rs"; fi
          if [[ "$b" == D ]]; then
            perl -pi -e 's/(EXISTING_PROFILE_SETUP_READY_TIMEOUT: Duration = Duration::from_secs\()12\)/${1}30)/' "$crates/cua-driver-core/src/browser/setup_descriptor.rs"
            git -C "$src" diff | grep -q "from_secs(30)" || { echo "timeout patch did not apply" >&2; exit 1; }
          fi
          if [[ "$b" =~ ^[EGHIJ]$ ]]; then patch diagnose_not_ready.pl "$macos/browser/setup_ui.rs"; fi
          if [[ "$b" =~ ^[GHIJ]$ ]]; then
            patch trace.pl "$macos/browser/setup_ui.rs" setup
            patch trace.pl "$macos/ax/enablement.rs" enablement
          fi
          if [[ "$b" == H || "$b" == J ]]; then patch trace.pl "$macos/ax/bindings.rs" bindings; fi
          if [[ "$b" == J ]]; then patch refusal_backoff.pl "$macos/ax/enablement.rs"; fi
          if [[ "$b" == I ]]; then patch trace.pl "$macos/ax/bindings.rs" bindings-fallback; fi
          if [[ "$b" =~ ^[KLMNP]$ ]]; then git -C "$src" apply "$GITHUB_WORKSPACE/ab/opt_in_backoff.patch"; fi
          if [[ "$b" == N || "$b" == P ]]; then git -C "$src" apply "$GITHUB_WORKSPACE/ab/first_read_wait.patch"; fi
          if [[ "$b" =~ ^[KLP]$ ]]; then patch trace.pl "$macos/browser/setup_ui.rs" setup; fi
          git -C "$src" diff --stat
          if [[ "$b" != A ]]; then
            git -C "$src" -c user.name=ab -c user.email=ab@example.com commit -qam "ab: build $b"
          fi
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bootstrap driver, then probe
        env:
          CUA_E2E_INTERNAL_LANE: browser
          AB_PROBE: ${{ github.workspace }}/ab/mac_focus.py
          AB_VARIANT: ${{ matrix.variant }}
          AB_BUILD: ${{ matrix.build }}
          AB_TYPING: ${{ matrix.typing }}
          AB_PREWARM: ${{ matrix.prewarm }}
          AB_TRIAL: ${{ matrix.trial }}
          AB_CYCLES: "12"
          AB_ARMS: ${{ (matrix.build == 'M' || matrix.build == 'N') && 'first_read' || 'off' }}
          AB_FRAMES: ${{ matrix.build == 'L' && 'on' || 'off' }}
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOF'
          mark_phase "ab-probe"
          MATRIX_STATUS=0
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 2700 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${DAEMON_SOCKET}" "${AB_VARIANT}" "${AB_BUILD}" || MATRIX_STATUS=$?
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit "${MATRIX_STATUS}"
          EOF
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - name: Unit tests
        if: ${{ !cancelled() && (matrix.build == 'M' || matrix.build == 'N') && matrix.trial == 1 }}
        run: |
          cd "$SRC/libs/cua-driver/rust"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo test --locked -p platform-macos --lib ax::enablement
      - name: Clippy with the pinned toolchain
        if: ${{ !cancelled() && (matrix.build == 'M' || matrix.build == 'N') && matrix.trial == 1 }}
        continue-on-error: true
        run: |
          cd "$SRC/libs/cua-driver/rust"
          rustup component add clippy
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo clippy --locked -p platform-macos --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.variant }}-${{ matrix.build }}-prewarm-${{ matrix.prewarm }}-t${{ matrix.trial }}
          path: |
            ab/shots
            ab/frames
            /tmp/cua-ab-trace.log
            ${{ env.SRC }}/artifacts/cua-driver/macos-hosted-bootstrap
          if-no-files-found: ignore
