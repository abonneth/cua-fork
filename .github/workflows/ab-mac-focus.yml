name: ab-mac-focus

on:
  push:
    branches: [ab/mac-focus]
  workflow_dispatch:

env:
  SHA_A: e3b909029d8dc0d5a0c7269b3fac378eddb01e10
  SHA_Q: 2d712d9889ad6c67dc194bbfcd2498124112b1bb
  SHA_F: 95567325cef9856400ebc96400c675a59f2f9f88
  CUA_E2E_RETRY_ONCE: "1"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  focus:
    name: ${{ matrix.build }} ${{ matrix.mode }} ${{ matrix.arms }} t${{ matrix.trial }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.mode == 'e2e' && 200 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: Q, mode: e2e, arms: lane, trial: 1 }
          - { build: F, mode: e2e, arms: lane, trial: 1 }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ffmpeg jq 2>/dev/null || true
      - name: Source ${{ matrix.build }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          case "${{ matrix.build }}" in
            A) sha="$SHA_A" ;;
            Q) sha="$SHA_Q" ;;
            F) sha="$SHA_F" ;;
          esac
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" fetch --quiet https://github.com/abonneth/cua-fork "$sha" || git -C "$src" fetch --quiet origin "$sha"
          git -C "$src" checkout --quiet --force "$sha"
          [[ "$(git -C "$src" rev-parse HEAD)" == "$sha" ]]
          echo "tested source: $sha (+$(git -C "$src" rev-list --count "$sha"..HEAD) harness commit)"
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Upstream hosted browser lane
        if: ${{ matrix.mode == 'e2e' }}
        continue-on-error: true
        env:
          CUA_E2E_INTERNAL_LANE: browser
        run: |
          set -euo pipefail
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash scripts/ci/macos/run-hosted-rust-e2e.sh
      - name: Lane summary
        if: ${{ always() && matrix.mode == 'e2e' }}
        run: |
          out="$SRC/artifacts/cua-driver/macos-standalone-browser"
          [[ -f "$out/summary.md" ]] && cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
          bash "$SRC/scripts/ci/summarize-flaky-cases.sh" "$SRC/artifacts/cua-driver" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Bootstrap driver, then probe
        if: ${{ matrix.mode == 'probe' }}
        env:
          CUA_E2E_INTERNAL_LANE: browser
          AB_PROBE: ${{ github.workspace }}/ab/mac_focus.py
          AB_VARIANT: driver-enables-remote-debugging
          AB_BUILD: ${{ matrix.build }}
          AB_TYPING: "on"
          AB_PREWARM: "off"
          AB_TRIAL: ${{ matrix.trial }}
          AB_CYCLES: ${{ matrix.cycles || '12' }}
          AB_ARMS: ${{ matrix.arms }}
          AB_THEN_REPS: ${{ matrix.reps }}
          AB_FRAMES: ${{ matrix.frames }}
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOS'
          mark_phase "ab-probe"
          MATRIX_STATUS=0
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 3300 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${DAEMON_SOCKET}" "${AB_VARIANT}" "${AB_BUILD}" || MATRIX_STATUS=$?
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit "${MATRIX_STATUS}"
          EOS
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - name: Unit tests, as ci-rust-macos runs them
        if: ${{ !cancelled() && matrix.checks == 'on' }}
        run: |
          cd "$SRC/libs/cua-driver/rust"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo test --locked -p platform-macos --lib 2>&1 | tail -15
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo test --locked -p cua-driver-core --lib browser:: 2>&1 | tail -5
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo test --locked -p cua-driver-e2e 2>&1 | tail -8
      - name: Clippy, as ci-rust-macos runs it
        if: ${{ !cancelled() && matrix.checks == 'on' }}
        run: |
          cd "$SRC/libs/cua-driver/rust"
          rustup component add clippy
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.build }}-${{ matrix.mode }}-${{ matrix.arms == 'minimized,hidden' && 'away' || matrix.arms }}-t${{ matrix.trial }}
          path: |
            ab/shots
            ab/frames
            /tmp/cua-ab-trace.log
            ${{ env.SRC }}/artifacts/cua-driver
          if-no-files-found: ignore
