name: ab-mac-focus

on:
  push:
    branches: [ab/mac-focus]
  workflow_dispatch:

env:
  MAIN_SHA: 2808b642accf99c0a27b9667dc62f28a978c6837
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  focus:
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [driver-enables-remote-debugging]
        build: [E]
        typing: [on]
        prewarm: [off, on]
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ffmpeg jq 2>/dev/null || true
      - name: Source ${{ matrix.build }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" checkout --quiet --force "$MAIN_SHA"
          if [[ "${{ matrix.build }}" != A ]]; then
            file="$src/libs/cua-driver/rust/crates/platform-macos/src/browser/platform.rs"
            perl -0pi -e 's/fn guarded_attach_allowed\(window_on_current_space: Option<bool>\) -> bool \{\n    window_on_current_space == Some\(false\)\n\}/fn guarded_attach_allowed(_window_on_current_space: Option<bool>) -> bool {\n    true\n}/' "$file"
            git -C "$src" diff --stat
            git -C "$src" diff | grep -q "^+    true" || { echo "patch did not apply" >&2; exit 1; }
            git -C "$src" -c user.name=ab -c user.email=ab@example.com commit -qam "ab: guard same-Space attach"
          fi
          if [[ "${{ matrix.build }}" == C || "${{ matrix.build }}" == D || "${{ matrix.build }}" == E ]]; then
            setup="$src/libs/cua-driver/rust/crates/platform-macos/src/browser/setup_ui.rs"
            perl ab/wait_for_ax_checkbox.pl < "$setup" > "$setup.new" && mv "$setup.new" "$setup"
            git -C "$src" diff
            git -C "$src" -c user.name=ab -c user.email=ab@example.com commit -qam "ab: guarded setup waits for the AX checkbox"
          fi
          if [[ "${{ matrix.build }}" == D ]]; then
            descriptor="$src/libs/cua-driver/rust/crates/cua-driver-core/src/browser/setup_descriptor.rs"
            perl -pi -e 's/(EXISTING_PROFILE_SETUP_READY_TIMEOUT: Duration = Duration::from_secs\()12\)/${1}30)/' "$descriptor"
            git -C "$src" diff | grep -q "from_secs(30)" || { echo "timeout patch did not apply" >&2; exit 1; }
            git -C "$src" -c user.name=ab -c user.email=ab@example.com commit -qam "ab: 30 s setup readiness"
          fi
          if [[ "${{ matrix.build }}" == E ]]; then
            setup="$src/libs/cua-driver/rust/crates/platform-macos/src/browser/setup_ui.rs"
            perl ab/diagnose_not_ready.pl < "$setup" > "$setup.new" && mv "$setup.new" "$setup"
            git -C "$src" -c user.name=ab -c user.email=ab@example.com commit -qam "ab: describe the AX tree when setup is not ready"
          fi
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bootstrap driver, then probe
        env:
          CUA_E2E_INTERNAL_LANE: browser
          AB_PROBE: ${{ github.workspace }}/ab/mac_focus.py
          AB_VARIANT: ${{ matrix.variant }}
          AB_BUILD: ${{ matrix.build }}
          AB_TYPING: ${{ matrix.typing }}
          AB_PREWARM: ${{ matrix.prewarm }}
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOF'
          mark_phase "ab-probe"
          MATRIX_STATUS=0
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 2700 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${DAEMON_SOCKET}" "${AB_VARIANT}" "${AB_BUILD}" || MATRIX_STATUS=$?
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit "${MATRIX_STATUS}"
          EOF
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.variant }}-${{ matrix.build }}-prewarm-${{ matrix.prewarm }}-t${{ matrix.trial }}
          path: |
            ab/shots
            ${{ env.SRC }}/artifacts/cua-driver/macos-hosted-bootstrap
          if-no-files-found: ignore
