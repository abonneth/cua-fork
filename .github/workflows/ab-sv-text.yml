name: "ab: macOS set_value numeric text"

on:
  push:
    branches: [ab/macos-set-value-text-stays-text]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the fork to test"
        required: true
        type: string
      checks:
        description: "Also run fmt, clippy and unit tests"
        required: false
        type: boolean
        default: false
      runner:
        description: "macOS runner label"
        required: false
        type: string
        default: macos-26
      probe:
        description: "Run the Swift-only AX probe instead of the e2e lane"
        required: false
        type: boolean
        default: false
      lane:
        required: false
        type: string
        default: native
      harness_filter:
        required: false
        type: string
        default: appkit
      cell_filter:
        required: false
        type: string
        default: macos-appkit-set-value-numeric-text-ax-background,macos-appkit-set-value-ax-background

permissions:
  contents: read

env:
  SHA: ${{ inputs.sha || '164544e18b9c0a928f0a4c5f3690fc7528ba2b51' }}
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' && !inputs.probe
    name: appkit set_value e2e
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 120
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.sha || '164544e18b9c0a928f0a4c5f3690fc7528ba2b51' }}
      CUA_E2E_INTERNAL_LANE: ${{ inputs.lane || 'native' }}
      CUA_E2E_HARNESS_FILTER: ${{ inputs.harness_filter || 'appkit' }}
      CUA_E2E_CELL_FILTER: ${{ inputs.cell_filter || 'macos-appkit-set-value-numeric-text-ax-background,macos-appkit-set-value-ax-background' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Target dir
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cua-driver-target-native" >> "${GITHUB_ENV}"
      - name: Install missing test dependencies
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if ((${#missing[@]})); then brew install "${missing[@]}"; fi
      - name: Relax the arm64-only host model check
        if: contains(inputs.runner, 'intel')
        run: |
          sysctl -n hw.model; csrutil status || true; echo "ImageOS=${ImageOS}"
          sed -i '' 's/\[\[ "${MODEL}" == VirtualMac\* \]\]/true/' scripts/ci/macos/run-hosted-rust-e2e.sh
          git update-index --assume-unchanged scripts/ci/macos/run-hosted-rust-e2e.sh
          grep -n 'VirtualMac' scripts/ci/macos/run-hosted-rust-e2e.sh
      - name: Run hosted macOS lane (filtered)
        run: scripts/ci/macos/run-hosted-rust-e2e.sh
      - name: Show set_value evidence
        if: always()
        run: |
          grep -rhE "PROBE|set_value (txt-input|sld-value)|after set_value|does not hold|test result|panicked" \
            artifacts/cua-driver/macos/*.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ab-sv-text-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cua-driver
          if-no-files-found: warn
          retention-days: 7

  checks:
    if: inputs.checks
    name: fmt, clippy, unit tests
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - name: fmt
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all --check
      - name: clippy platform-macos
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p platform-macos --all-targets -- -D warnings
      - name: clippy cua-driver-e2e
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver-e2e --all-targets -- -D warnings
      - name: platform-macos unit tests
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_ALLOW_CLIPBOARD: "1"
        run: cargo test --locked -p platform-macos --lib
      - name: hermetic cua-driver-e2e tests
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver-e2e
      - name: AppKit cell manifest
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install -q pytest
          "${RUNNER_TEMP}/venv/bin/pytest" -q libs/cua-driver/scripts/tests/test_macos_lume_runner.py -k appkit

  probe:
    if: inputs.probe
    name: swift AX probe
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          sw_vers; sysctl -n hw.model; csrutil status || true
          xcrun swiftc .github/ab/sv-text/fixture.swift -o "${RUNNER_TEMP}/fixture"
          xcrun swiftc .github/ab/sv-text/probe.swift -o "${RUNNER_TEMP}/probe"
      - name: Accessibility for the probe
        run: |
          "${RUNNER_TEMP}/probe" 0 - x | tee trust.txt
          if grep -q "AXIsProcessTrusted=false" trust.txt; then
            sudo sqlite3 -cmd ".timeout 30000" "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,last_modified) VALUES ('kTCCServiceAccessibility','${RUNNER_TEMP}/probe',1,2,4,1,NULL,0,0,'UNUSED',NULL,strftime('%s','now'));"
            sudo killall tccd || true
            sleep 3
            "${RUNNER_TEMP}/probe" 0 - x
          fi
      - name: Probe AppKit, SwiftUI and WKWebView fields
        run: |
          "${RUNNER_TEMP}/fixture" "${RUNNER_TEMP}/state.json" &
          pid=$!
          sleep 8
          cat "${RUNNER_TEMP}/state.json" || true
          echo
          "${RUNNER_TEMP}/probe" "${pid}" "${RUNNER_TEMP}/state.json" native
          kill "${pid}" || true
      - name: Probe a Chrome input
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -x "${chrome}" ] || { echo "no Chrome"; exit 0; }
          "${chrome}" --user-data-dir="${RUNNER_TEMP}/chrome" --force-renderer-accessibility \
            --no-first-run --no-default-browser-check \
            "data:text/html,<input aria-label=webfield>" >/dev/null 2>&1 &
          pid=$!
          sleep 12
          "${RUNNER_TEMP}/probe" "${pid}" - chrome
          kill "${pid}" || true
