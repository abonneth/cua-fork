name: ab-web-perf

on:
  push:
    branches: [ab/web-perf]
  workflow_dispatch:

env:
  SHA_A: 04d952f8c8336b1d2083b22c513a3fa9f662927e
  SHA_B: 5881d4f047ec5aa138c9ba718e6e47e02ea0712c
  SHA_C: 77c4fcc4c2f62f1ad74e2db080cd6ad23b24cbfd
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  perf:
    name: perf ${{ matrix.build }}
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        build: [A, B, C]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ffmpeg jq 2>/dev/null || true
      - name: Source ${{ matrix.build }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          sha_var="SHA_${{ matrix.build }}"; sha="${!sha_var}"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" fetch --quiet https://github.com/abonneth/cua-fork "$sha" || git -C "$src" fetch --quiet origin "$sha"
          git -C "$src" checkout --quiet --force "$sha"
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SRC_SHA=$sha" >> "$GITHUB_ENV"
      - name: Bootstrap driver, then probe
        env:
          CUA_E2E_INTERNAL_LANE: browser
          AB_PROBE: ${{ github.workspace }}/ab/web_perf.py
          AB_BUILD: ${{ matrix.build }}
          REPS: "20"
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOS'
          mark_phase "ab-probe"
          MATRIX_STATUS=0
          STD_SOCKET="${HOME}/Library/Caches/cua-driver-local/ab-standard.sock"
          open -n -g "${LOCAL_APP}" --args --socket "${STD_SOCKET}" serve --grant existing-profile
          for _ in {1..60}; do [[ -S "${STD_SOCKET}" ]] && break; sleep 1; done
          "${INSTALLED_BIN}" --socket "${STD_SOCKET}" status || true
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 1500 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${STD_SOCKET}" "${AB_BUILD}-standard" || MATRIX_STATUS=$?
          pkill -x "Google Chrome" || true; sleep 4
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 1500 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${DAEMON_SOCKET}" "${AB_BUILD}-unrestricted" || MATRIX_STATUS=$?
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit "${MATRIX_STATUS}"
          EOS
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.build }}
          path: |
            ab/perf-*.json
            ${{ env.SRC }}/artifacts/cua-driver
          if-no-files-found: ignore

  checks:
    name: checks ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-26-intel]
    steps:
      - name: Source C
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua src
          git -C src fetch --quiet https://github.com/abonneth/cua-fork "$SHA_C"
          git -C src checkout --quiet --force "$SHA_C"
      - name: Tests
        working-directory: src/libs/cua-driver/rust
        run: |
          set -euo pipefail
          cargo test --locked -p platform-macos --lib browser:: 2>&1 | tail -25
          cargo test --locked -p cua-driver-core --lib 2>&1 | tail -25
      - name: Clippy and fmt
        if: matrix.os == 'macos-26'
        working-directory: src/libs/cua-driver/rust
        run: |
          set -euo pipefail
          rustup component add clippy rustfmt
          cargo fmt --all -- --check
          cargo clippy --locked -p platform-macos -p cua-driver-core --all-targets -- -D warnings
