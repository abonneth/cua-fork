name: ab-web-perf

on:
  push:
    branches: [ab/readback-perf]
  workflow_dispatch:

env:
  SHA_A: b6b335c915ed9c3b78a77707bebd76f3552a88d5
  SHA_B: 68996144b5e0617f05d39f2511c98d53b3a46e3c
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  perf:
    name: perf ${{ matrix.build }}
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        build: [A, B]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ffmpeg jq 2>/dev/null || true
      - name: Source ${{ matrix.build }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          sha_var="SHA_${{ matrix.build }}"; sha="${!sha_var}"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" fetch --quiet https://github.com/abonneth/cua-fork "$sha" || git -C "$src" fetch --quiet origin "$sha"
          git -C "$src" checkout --quiet --force "$sha"
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SRC_SHA=$sha" >> "$GITHUB_ENV"
      - name: Bootstrap driver, then probe
        env:
          CUA_E2E_INTERNAL_LANE: browser
          AB_PROBE: ${{ github.workspace }}/ab/web_perf.py
          AB_BUILD: ${{ matrix.build }}
          AB_REP: ${{ matrix.rep }}
          REPS: "20"
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOS'
          mark_phase "ab-probe"
          MATRIX_STATUS=0
          probe() {
            local name="$1"; shift
            local sock="${HOME}/Library/Caches/cua-driver-local/ab-${name}.sock"
            open -n -g "${LOCAL_APP}" --args --socket "${sock}" serve "$@"
            for _ in {1..60}; do [[ -S "${sock}" ]] && break; sleep 1; done
            "${INSTALLED_BIN}" --socket "${sock}" status | grep -E 'permission mode' || true
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 900 python3 -u "${AB_PROBE}" "${INSTALLED_BIN}" "${sock}" "${AB_BUILD}${AB_REP}-${name}" || MATRIX_STATUS=$?
            kill "$("${INSTALLED_BIN}" --socket "${sock}" status 2>/dev/null | awk '/^ *pid:/{print $2}')" 2>/dev/null || true
            pkill -x "Google Chrome" || true; sleep 4
          }
          probe standard-nooverlay --no-overlay --grant existing-profile
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit "${MATRIX_STATUS}"
          EOS
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$SRC_SHA" CUA_E2E_WORKFLOW_SHA="$SRC_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.build }}${{ matrix.rep }}
          path: |
            ab/perf-*.json
            ${{ env.SRC }}/artifacts/cua-driver
          if-no-files-found: ignore

