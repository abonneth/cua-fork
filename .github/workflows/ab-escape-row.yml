name: "ab: escape tree row text"

on:
  push:
    branches: [ab/escape-tree-row-text]

permissions:
  contents: read

env:
  TARGET_SHA: a48a8c0dd99067dd862776de4d2847823b1f2d88
  CHECKS: "true"
  CARGO_NET_RETRY: "10"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"

jobs:
  e2e-linux:
    name: "Linux Xvfb GTK3 live repro"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ab/escape-tree-row-text
          path: harness
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
      - uses: ./.github/actions/apt-install
        with:
          packages: >-
            xvfb dbus-x11 at-spi2-core openbox python3-gi gir1.2-gtk-3.0 clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxdo-dev libssl-dev
      - name: Build cua-driver
        run: cargo build --release --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Run repro
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -c \
            "openbox >/tmp/openbox.log 2>&1 & sleep 2; python3 harness/.github/ab/escape-row/repro.py --driver libs/cua-driver/rust/target/release/cua-driver --out artifacts/repro"

  linux-unit:
    name: "Linux core + platform-linux tests, fmt, clippy"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
      - uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
            xvfb xauth at-spi2-core
      - name: fmt
        if: env.CHECKS == 'true'
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all --check
      - name: clippy
        if: env.CHECKS == 'true'
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver-core -p platform-linux --all-targets -- -D warnings
      - name: test cua-driver-core
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver-core --lib
      - name: test platform-linux
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p platform-linux --lib

  macos-unit:
    name: "macOS platform-macos tests, clippy"
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
      - name: clippy
        if: env.CHECKS == 'true'
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p platform-macos --all-targets -- -D warnings
      - name: test platform-macos
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p platform-macos --lib -- --skip the_system_consent_labels_include_allow_and_dont_allow

  windows-unit:
    name: "Windows platform-windows tests, clippy"
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
      - name: clippy
        if: env.CHECKS == 'true'
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p platform-windows --all-targets -- -D warnings
      - name: test platform-windows
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p platform-windows --lib
