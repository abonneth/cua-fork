name: ab-enter

on:
  push:
    branches: [ab/enter]
  workflow_dispatch:

jobs:
  enter:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        route: ["msaa toggle", "posted click toggle"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        working-directory: ab
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          (Get-Item $edge).VersionInfo.ProductVersion
          $env:EDGE = $edge
          Get-Process WWAHost, SearchHost, StartMenuExperienceHost -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          pip install -q uiautomation
          Start-Process $edge -ArgumentList '--no-first-run', '--no-default-browser-check', 'https://example.com'
          Start-Sleep 8
          $worker = Start-Process python -ArgumentList 'enter_probe.py', 'worker' -PassThru -NoNewWindow
          Start-Sleep 4
          python enter_probe.py "${{ matrix.route }}"
          $worker.WaitForExit(10000)
