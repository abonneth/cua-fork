name: ab-checks
on:
  push:
    branches: [ab/checks-readback]
env:
  SHA: 4bd610993f185dc5a8c5877d854c51b559ed2339
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua src
          git -C src fetch --quiet https://github.com/abonneth/cua-fork "$SHA"
          git -C src checkout --quiet --force "$SHA"
      - name: Format
        working-directory: src/libs/cua-driver/rust
        run: |
          rustup component add clippy rustfmt
          cargo fmt --all -- --check
      - name: Tests
        working-directory: src/libs/cua-driver/rust
        run: |
          set -euo pipefail
          cargo test --locked -p platform-macos --lib 2>&1 | tail -25
          cargo test --locked -p cua-driver-core --lib browser:: 2>&1 | tail -25
      - name: Clippy
        working-directory: src/libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver-core -p platform-macos --all-targets -- -D warnings
