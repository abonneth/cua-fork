name: ab-focus

on:
  push:
    branches: [ab/focus]
  workflow_dispatch:

env:
  A_REF: 802cf587eb
  B_REF: 261445bb9728df4d4513458671acf42dbed2a2b0
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"

jobs:
  focus:
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [driver-enables-remote-debugging, remote-debugging-already-on]
        build: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ${{ matrix.build }}
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" fetch --quiet https://github.com/abonneth/cua-fork "$B_REF"
          ref_var="${{ matrix.build }}_REF"; git -C "$src" checkout --quiet --force "${!ref_var}"
          cd "$src/libs/cua-driver/rust"
          if [[ "${{ matrix.build }}" == B && "${{ matrix.variant }}" == remote-debugging-already-on ]]; then
            cargo test --locked -p platform-windows --lib browser_consent_ui
          fi
          cargo build --locked --release -p cua-driver
          ./target/release/cua-driver.exe --version
          echo "DRIVER=$(cygpath -w "$PWD/target/release/cua-driver.exe")" >> "$GITHUB_ENV"
      - name: Edge default profile
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          (Get-Item $edge).VersionInfo.ProductVersion
          "EDGE=$edge" >> $env:GITHUB_ENV
          $state = "$env:LOCALAPPDATA\Microsoft\Edge\User Data\Local State"
          Start-Process $edge -ArgumentList '--no-first-run', '--no-default-browser-check', 'about:blank'
          foreach ($i in 1..60) { if (Test-Path $state) { break }; Start-Sleep 1 }
          Start-Sleep 5
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          if ("${{ matrix.variant }}" -eq "remote-debugging-already-on") {
            $json = Get-Content $state -Raw | ConvertFrom-Json
            if (-not $json.devtools) { $json | Add-Member devtools ([pscustomobject]@{}) }
            $json.devtools | Add-Member remote_debugging ([pscustomobject]@{ 'user-enabled' = $true }) -Force
            $json | ConvertTo-Json -Depth 100 -Compress | Set-Content $state -Encoding utf8
          }
          (Get-Content $state -Raw | ConvertFrom-Json).devtools | ConvertTo-Json -Compress
      - name: Probe
        working-directory: ab
        shell: pwsh
        run: |
          Get-Process WWAHost, SearchHost, StartMenuExperienceHost -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          Start-Process $env:EDGE -ArgumentList '--no-first-run', '--no-default-browser-check', 'https://example.com'
          Start-Sleep 10
          $port = "$env:LOCALAPPDATA\Microsoft\Edge\User Data\DevToolsActivePort"
          "DevToolsActivePort before the probe: $(Test-Path $port)"
          pip install -q pillow
          python focus_steal.py $env:DRIVER "${{ matrix.variant }}-${{ matrix.build }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.variant }}-${{ matrix.build }}
          path: ab/shots
          if-no-files-found: ignore
