name: "ab: windows type_text unreadable value"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the fork to test"
        required: true
      checks:
        description: "Also run fmt, clippy and platform-windows unit tests"
        required: false
        default: "false"

permissions:
  contents: read

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  repro:
    name: "WPF unreadable value repro @ ${{ inputs.sha }}"
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          path: harness
          sparse-checkout: .github/ab
      - name: Show source under test
        shell: bash
        run: git log --oneline -3
      - name: Probe real password fields (managed UIA client)
        shell: powershell
        continue-on-error: true
        run: .\harness\.github\ab\unreadable-value\probe-password-fields.ps1
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: ab-unreadable-value
          save-if: "true"
      - name: Ensure FFmpeg for trajectory video
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Build driver and WPF harness
        shell: pwsh
        run: |
          .\scripts\ci\windows\verify-user-session.ps1
          cargo build --locked --release -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\ci\windows\build-harnesses.ps1 -Targets wpf
      - name: Run WPF type_text cases
        shell: pwsh
        run: |
          $rustRoot = Join-Path $PWD "libs\cua-driver\rust"
          $artifactDir = Join-Path $PWD "artifacts\ab"
          New-Item -ItemType Directory -Force (Join-Path $artifactDir "recordings") | Out-Null
          $env:CUA_E2E_DECLARATIONS_FILE = Join-Path $artifactDir "cases.jsonl"
          $env:CUA_E2E_ENVIRONMENT_FILE = Join-Path $artifactDir "environment.jsonl"
          $env:CUA_E2E_RESULTS_FILE = Join-Path $artifactDir "results.jsonl"
          $env:CUA_E2E_RECORDINGS_ROOT = Join-Path $artifactDir "recordings"
          $env:CUA_REQUIRE_GUI = "1"
          $env:CUA_TEST_WORKSPACE_ROOT = $rustRoot
          $env:CUA_TEST_DRIVER_BIN = Join-Path $rustRoot "target\release\cua-driver.exe"
          $env:CUA_TEST_APPS_ROOT = Join-Path $rustRoot "test-apps"
          $env:CUA_TEST_REQUIRE_FIXTURES = "1"
          $env:CUA_TEST_DRIVER_STDERR = "1"
          $env:CUA_E2E_FORBID_SKIPS = "1"
          $env:CUA_E2E_UNRESTRICTED_GUI = "1"
          Set-Location $rustRoot
          cargo test --locked -p cua-driver-e2e --test harness_wpf_test -- --ignored --exact `
            harness_wpf_type_text_refuses_to_replace_an_unreadable_value `
            harness_wpf_deferred_type_text_requires_fresh_snapshot_before_retry `
            harness_wpf_set_value `
            --nocapture --test-threads=1
          exit $LASTEXITCODE
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ab-unreadable-value-${{ inputs.sha }}
          path: artifacts/ab
          if-no-files-found: ignore
          retention-days: 7

  checks:
    if: inputs.checks == 'true'
    name: "fmt + clippy + unit @ ${{ inputs.sha }}"
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          shared-key: ab-unreadable-value-checks
          save-if: "true"
      - name: cargo fmt --check
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p platform-windows -p cua-driver-e2e --all-targets -- -D warnings
      - name: platform-windows unit tests
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_ALLOW_CLIPBOARD: "1"
        run: cargo test --locked -p platform-windows --lib
