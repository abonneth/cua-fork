name: ab-daemon-lifecycle

on:
  push:
    branches: [ab/daemon-survives-accept-errors-and-signals]

env:
  SHA: 55d64ee892baf143c99754438e9989a134a56c18
  TEST_SHA: ""
  CHECKS: "false"
  PYTHON: "true"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  TEST_FILE: libs/cua-driver/rust/crates/cua-driver/tests/serve_lifecycle_cli_test.rs

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: ./.github/actions/linux-rust-prep
      - uses: ./.github/actions/apt-install
        with:
          packages: xvfb xauth x11-utils ffmpeg dbus-daemon at-spi2-core
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy, rustfmt
      - name: Take the regression test
        if: env.TEST_SHA != ''
        run: |
          git fetch --depth 1 origin ${{ env.TEST_SHA }}
          git checkout ${{ env.TEST_SHA }} -- $TEST_FILE
          git status --short
      - name: Build
        working-directory: libs/cua-driver/rust
        run: |
          echo "source $(git rev-parse HEAD)"
          cargo build --locked -p cua-driver $([ "${{ env.PYTHON }}" = true ] && echo "-p cua-driver-sdk")
      - name: Repro accept errors
        if: always()
        continue-on-error: true
        run: bash harness/.github/ab/daemon-lifecycle/accept_errors.sh libs/cua-driver/rust/target/debug/cua-driver 64
      - name: Repro SIGTERM while recording
        if: always()
        continue-on-error: true
        run: xvfb-run -a dbus-run-session -- bash harness/.github/ab/daemon-lifecycle/sigterm.sh libs/cua-driver/rust/target/debug/cua-driver
      - name: Repro Python wrapper SIGTERM
        if: always() && env.PYTHON == 'true'
        continue-on-error: true
        run: |
          bash harness/.github/ab/daemon-lifecycle/py_wrapper.sh \
            libs/cua-driver/rust/target/debug/cua-driver \
            libs/cua-driver/rust/target/debug/libcua_driver_sdk.so \
            libs/cua-driver/python
      - name: Python wrapper tests and lint
        if: always() && env.PYTHON == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/python
        run: |
          python3 -m venv /tmp/py-checks
          /tmp/py-checks/bin/pip install -q pytest ruff
          /tmp/py-checks/bin/python -m pytest tests/test_wrapper.py tests/test_compatibility_contract.py -q
          /tmp/py-checks/bin/ruff check src/cua_driver/wrapper.py src/cua_driver/__main__.py tests/test_wrapper.py
          /tmp/py-checks/bin/ruff format --diff src/cua_driver/wrapper.py src/cua_driver/__main__.py tests/test_wrapper.py || true
      - name: Regression test
        if: always() && (env.TEST_SHA != '' || env.CHECKS == 'true')
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver --test serve_lifecycle_cli_test -- --nocapture
      - name: fmt
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all --check
      - name: clippy
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver --all-targets -- -D warnings
      - name: cua-driver tests
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        run: cargo test --locked -p cua-driver

  macos:
    if: false
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy
      - name: Take the regression test
        if: env.TEST_SHA != ''
        run: |
          git fetch --depth 1 origin ${{ env.TEST_SHA }}
          git checkout ${{ env.TEST_SHA }} -- $TEST_FILE
      - name: Regression test
        if: always()
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_DRIVER_STDERR: "1"
        run: cargo test --locked -p cua-driver --test serve_lifecycle_cli_test --test status_pid_file_cli_test -- --nocapture
      - name: clippy
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver --all-targets -- -D warnings
      - name: serve unit tests
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: "cargo test --locked -p cua-driver --bin cua-driver serve::"

  windows:
    if: false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: libs/cua-driver/rust
        run: cargo build --locked -p cua-driver
      - name: Repro Ctrl+Break
        if: always()
        continue-on-error: true
        run: python harness/.github/ab/daemon-lifecycle/ctrl_break.py libs/cua-driver/rust/target/debug/cua-driver.exe
      - name: clippy
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver --all-targets -- -D warnings
      - name: Windows daemon tests
        if: always() && env.CHECKS == 'true'
        continue-on-error: true
        working-directory: libs/cua-driver/rust
        run: |
          cargo test --locked -p cua-driver --test named_pipe_instance_recovery_test --test status_pid_file_cli_test -- --nocapture
          cargo test --locked -p cua-driver --bin cua-driver serve::
