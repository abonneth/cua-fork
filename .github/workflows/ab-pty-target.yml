name: ab-pty-target

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the fork to test"
        required: true
      checks:
        description: "Also run fmt, clippy and platform-linux unit tests"
        default: "false"

permissions:
  contents: read

env:
  CARGO_NET_RETRY: "10"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          path: harness
      - uses: ./.github/actions/linux-rust-prep
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          shared-key: ab-pty-target
      - name: Install terminals
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth openbox xfce4-terminal xterm fzf dbus-x11 x11-utils
      - name: Build cua-driver
        working-directory: libs/cua-driver/rust
        run: cargo build --locked -p cua-driver
      - name: Repro
        run: |
          echo "source sha: $(git rev-parse HEAD)"
          sudo sysctl -w kernel.yama.ptrace_scope=0
          xvfb-run -a --server-args="-screen 0 1280x800x24" dbus-run-session -- \
            python3 harness/.github/ab/pty-target/repro.py libs/cua-driver/rust/target/debug/cua-driver
      - name: fmt
        if: ${{ !cancelled() && inputs.checks == 'true' }}
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() && inputs.checks == 'true' }}
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p platform-linux --all-targets -- -D warnings
      - name: platform-linux unit tests
        if: ${{ !cancelled() && inputs.checks == 'true' }}
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p platform-linux --lib
