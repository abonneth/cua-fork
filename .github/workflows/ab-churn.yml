name: ab-churn

on:
  push:
    branches: [ab/freecad-churn]
  workflow_dispatch:

env:
  DRIVER_SHA: 68210fe377a532e7e3b58fa03c95d7fe9d11339b
  FREECAD: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  HEADER: "| arm | error | walk s (med) | nodes (med) | truncated | app RSS MB base > after walks > idle | driver RSS MB | big walk s / nodes / app RSS | errors |\n|---|---|---|---|---|---|---|---|---|"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desktop and FreeCAD
        run: |
          apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3)
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 at-spi2-core xfce4 libfuse2 \
            libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0
          curl -fsSL -o /tmp/FreeCAD.AppImage "${FREECAD}-Linux-x86_64-py311.AppImage"
          chmod +x /tmp/FreeCAD.AppImage && (cd /tmp && /tmp/FreeCAD.AppImage --appimage-extract >/dev/null)
          pip install -q psutil "cua-driver==0.58.1"
      - name: Churn the model tree, with and without walks
        env:
          DISPLAY: ":99"
        run: |
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp &
          for _ in $(seq 20); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.5; done
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          for _ in $(seq 30); do xwininfo -root -tree 2>/dev/null | grep -q xfdesktop && break; sleep 1; done
          mkdir -p ab-results
          cua-driver serve --socket /tmp/ab.sock > ab-results/driver.log 2>&1 &
          for _ in $(seq 30); do [ -S /tmp/ab.sock ] && break; sleep 0.5; done
          echo -e "$HEADER" >> "$GITHUB_STEP_SUMMARY"
          for t in 1 2 3; do
            AB_WALKS=0 AB_BIG_WALKS=0 AB_IDLE_S=120 timeout 900 python ab/heavy_apps.py /tmp/ab.sock "control-t$t" "/tmp/squashfs-root/AppRun $PWD/ab/churn.py" 'freecad|AppRun' || true
            AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=30 timeout 900 python ab/heavy_apps.py /tmp/ab.sock "walks-t$t" "/tmp/squashfs-root/AppRun $PWD/ab/churn.py" 'freecad|AppRun' || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: churn-linux
          path: ab-results

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FreeCAD
        shell: pwsh
        run: |
          pip install -q psutil "cua-driver==0.58.1"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\fc.7z" "$env:FREECAD-Windows-x86_64-py311.7z"
          7z x -y -o"$env:RUNNER_TEMP\fc" "$env:RUNNER_TEMP\fc.7z" | Out-Null
          $exe = Get-ChildItem "$env:RUNNER_TEMP\fc" -Recurse -Filter FreeCAD.exe | Select-Object -First 1
          "FREECAD_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Churn the model tree, with and without walks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab-results | Out-Null
          $pipe = '\\.\pipe\ab-heavy'
          Start-Process cua-driver -ArgumentList 'serve', '--socket', $pipe -RedirectStandardError ab-results\driver.log -RedirectStandardOutput ab-results\driver.out -WindowStyle Hidden
          Start-Sleep 5
          ($env:HEADER -replace '\\n', "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $launch = "`"$env:FREECAD_EXE`" `"$PWD\ab\churn.py`""
          foreach ($t in 1..3) {
            $env:AB_WALKS = "0"; $env:AB_BIG_WALKS = "0"; $env:AB_IDLE_S = "120"
            python ab/heavy_apps.py $pipe "control-t$t" $launch freecad
            $env:AB_WALKS = "60"; $env:AB_IDLE_S = "30"
            python ab/heavy_apps.py $pipe "walks-t$t" $launch freecad
          }
          Get-ChildItem "$env:LOCALAPPDATA\CrashDumps" -ErrorAction SilentlyContinue | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: churn-windows
          path: ab-results

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FreeCAD
        run: |
          set -euo pipefail
          brew install jq 2>/dev/null || true
          pip install -q psutil
          curl -fsSL -o /tmp/fc.dmg "${FREECAD}-macOS-arm64-py311.dmg"
          mnt=$(hdiutil attach -nobrowse -readonly /tmp/fc.dmg | grep -o '/Volumes/.*' | head -1)
          cp -R "$mnt/FreeCAD.app" /Applications/ && hdiutil detach "$mnt" >/dev/null
          xattr -dr com.apple.quarantine /Applications/FreeCAD.app || true
          src="$RUNNER_TEMP/src"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" checkout --quiet --force "$DRIVER_SHA"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - name: Bootstrap the driver, then churn the model tree with and without walks
        env:
          CUA_E2E_INTERNAL_LANE: native
          AB_PROBE: ${{ github.workspace }}/ab/heavy_apps.py
          AB_CHURN: ${{ github.workspace }}/ab/churn.py
          AB_OUT: ${{ github.workspace }}/ab-results
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOS'
          mark_phase "ab-churn"
          mkdir -p "${AB_OUT}"
          echo -e "${HEADER}" >> "${GITHUB_STEP_SUMMARY}"
          probe() { /usr/bin/perl -e 'alarm shift; exec @ARGV' 900 python3 -u "${AB_PROBE}" "${DAEMON_SOCKET}" "$1" "/Applications/FreeCAD.app/Contents/MacOS/FreeCAD ${AB_CHURN}" FreeCAD || echo "probe $1 exit $?"; pkill -9 -f FreeCAD.app || true; sleep 3; }
          for t in 1 2 3; do
            AB_WALKS=0 AB_BIG_WALKS=0 AB_IDLE_S=120 probe "control-t$t"
            AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=30 probe "walks-t$t"
          done
          mkdir -p "${AB_OUT}/crash" && cp ~/Library/Logs/DiagnosticReports/FreeCAD* "${AB_OUT}/crash/" 2>/dev/null || true
          ls -la "${AB_OUT}/crash"
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit 0
          EOS
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$DRIVER_SHA" CUA_E2E_WORKFLOW_SHA="$DRIVER_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: churn-macos
          path: ab-results
          if-no-files-found: ignore
