name: ab-linux-dialog-focus

on:
  push:
    branches: [ab/linux-dialog-focus]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
      VERSION: "0.56.4"
    steps:
      - uses: actions/checkout@v4
      - name: Desktop
        run: |
          apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3)
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 at-spi2-core xfce4 mousepad xdotool python3-xlib
      - name: cua-driver release
        run: |
          curl -fsSL -o /tmp/d.tgz "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${VERSION}/cua-driver-rs-${VERSION}-linux-x86_64-binary.tar.gz"
          mkdir -p /tmp/d && tar -xzf /tmp/d.tgz -C /tmp/d
          bin=$(find /tmp/d -type f -name cua-driver | head -1); chmod +x "$bin"
          echo "DRIVER=$bin" >> "$GITHUB_ENV"
      - name: Repro
        run: |
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp &
          for _ in $(seq 20); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.5; done
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          for _ in $(seq 30); do xwininfo -root -tree 2>/dev/null | grep -q xfdesktop && break; sleep 1; done
          sleep 3
          xfwm4 --version | head -1; mousepad --version | head -1
          python3 ab/dialog_focus.py "$DRIVER"
      - if: always()
        run: tail -50 /tmp/serve.log || true
