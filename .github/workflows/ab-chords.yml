name: ab-chords

on:
  push:
    branches: [ab/chords]
  workflow_dispatch:

jobs:
  chords:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Edge
        shell: pwsh
        run: |
          pip install -q websocket-client
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          (Get-Item $edge).VersionInfo.ProductVersion
          Start-Process $edge -ArgumentList '--remote-debugging-port=9222', "--user-data-dir=$env:RUNNER_TEMP\edge", '--no-first-run', '--no-default-browser-check', 'about:blank'
          foreach ($i in 1..90) {
            try { Invoke-RestMethod http://127.0.0.1:9222/json/version | ConvertTo-Json -Compress; break } catch { Start-Sleep -Seconds 1 }
          }
      - name: Chords over CDP
        working-directory: ab
        shell: pwsh
        run: |
          $env:EDGE = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          python cdp_chords.py
