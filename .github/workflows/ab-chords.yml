name: ab-chords

on:
  push:
    branches: [ab/chords]
  workflow_dispatch:

jobs:
  chords:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Chrome
        shell: pwsh
        run: |
          pip install -q websocket-client
          $edge = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          (Get-Item $edge).VersionInfo.ProductVersion
          Start-Process $edge -ArgumentList '--remote-debugging-port=9222', "--user-data-dir=$env:RUNNER_TEMP\edge", '--no-first-run', '--no-default-browser-check', 'about:blank'
          $file = "$env:RUNNER_TEMP\edge\DevToolsActivePort"
          foreach ($i in 1..90) { if (Test-Path $file) { break }; Start-Sleep -Seconds 1 }
          Get-Content $file
          "CDP_PORT=$((Get-Content $file)[0])" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 5
      - name: Chords over CDP
        working-directory: ab
        run: python cdp_chords.py
