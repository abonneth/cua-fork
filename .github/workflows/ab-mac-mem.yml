name: ab-mac-mem

on:
  push:
    branches: [ab/mac-mem]
  workflow_dispatch:

env:
  SHA_A: 57edfe91a88fb8c9f97ce161ddeafefe533cd3de
  SHA_B: 91bd8e07d1ff78115f6ee0ad08c2464e47a07ed7
  SHA_C: 695131a85a8dd88953bb9b30853c013be651d840
  BIN_RUN: "43280001005"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  intel:
    name: intel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Main and the first commit, built by the earlier run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$BIN_RUN" --repo "$GITHUB_REPOSITORY" -n "bin-${{ matrix.os }}" -D "$RUNNER_TEMP/bin"
      - name: Build the fix head
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          git init -q "$src"
          git -C "$src" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$src" fetch -q --depth 1 origin "$SHA_C"
          git -C "$src" checkout -q --force "$SHA_C"
          cd "$src/libs/cua-driver/rust"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo build --locked --release -p cua-driver 2>&1 | tail -3
          cp "$RUNNER_TEMP/target/release/cua-driver" "$RUNNER_TEMP/bin/cua-driver-C"
          chmod +x "$RUNNER_TEMP"/bin/*
          shasum "$RUNNER_TEMP"/bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: bin3-${{ matrix.os }}
          path: ${{ runner.temp }}/bin
          retention-days: 3
      - name: Memory across captures
        env:
          AB_CALLS: "30"
          AB_SHOTS: ${{ runner.temp }}/shots
        run: |
          sw_vers
          sysctl -n hw.model
          system_profiler SPDisplaysDataType | grep -E "Resolution|UI Looks" || true
          for overlay in off on; do
            for run in A1:A C1:C B1:B C2:C A2:A; do
              AB_OVERLAY="$overlay" python3 -u ab/mac_mem.py "$RUNNER_TEMP/bin/cua-driver-${run#*:}" "${run%:*}-$overlay" || echo "run $run exited $?"
            done
          done
      - name: Screenshots, main against the fix
        run: |
          python3 ab/png_diff.py "$RUNNER_TEMP/shots" A1-off-shot:A2-off-shot A1-off-shot:C1-off-shot A2-off-shot:C2-off-shot A1-off-window:C1-off-window A1-on-shot:C1-on-shot || true
      - name: Main and the fix while four other daemons hold a capture session
        env:
          AB_CALLS: "10"
        run: |
          for held in H1 H2 H3 H4; do
            AB_LEAVE=1 AB_CALLS=3 python3 -u ab/mac_mem.py "$RUNNER_TEMP/bin/cua-driver-C" "$held" | grep -E "left running|SUMMARY|exit status" || true
          done
          pgrep -fl "cua-driver-C serve" || true
          for run in A3:A C3:C A4:A C4:C; do
            python3 -u ab/mac_mem.py "$RUNNER_TEMP/bin/cua-driver-${run#*:}" "${run%:*}-crowded" || echo "run $run exited $?"
          done
          pkill -f "cua-driver-C serve" || true
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i cua-driver || echo "no cua-driver crash report"
          newest=$(ls -t ~/Library/Logs/DiagnosticReports/cua-driver* 2>/dev/null | head -1)
          if [ -n "$newest" ]; then python3 ab/crash_head.py "$newest" || head -c 3000 "$newest"; fi
      - name: The same read outside the driver
        run: |
          swiftc -O -o "$RUNNER_TEMP/px_equal" ab/px_equal.swift
          "$RUNNER_TEMP/px_equal" || echo "px_equal exited $?"
          swiftc -Onone -o "$RUNNER_TEMP/cg_cache" ab/cg_cache.swift
          for variant in drawRGBA+work vimage+work; do "$RUNNER_TEMP/cg_cache" 20 "$variant" || echo "cg_cache exited $?"; done
      - name: Unit tests and clippy at the fix head
        run: |
          cd "$RUNNER_TEMP/src/libs/cua-driver/rust"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          rustup component add clippy
          cargo test --locked -p platform-macos --lib 2>&1 | tail -25 || echo "tests exited $?"
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tail -15 || echo "clippy exited $?"
