name: ab-qt-matrix

on:
  push:
    branches: [ab/qt-matrix]
  workflow_dispatch:

env:
  DRIVER_SHA: 68210fe377a532e7e3b58fa03c95d7fe9d11339b
  FREECAD: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-macOS-arm64-py311.dmg
  FREECAD_WEEKLY: https://github.com/FreeCAD/FreeCAD/releases/download/weekly-2026.11.18/FreeCAD_weekly-2026.11.18-macOS15-arm64.dmg
  QT_VERSIONS: "pyqt5 6.5.3 6.7.3 6.8.0 6.8.2 6.8.3 6.9.0 6.9.2 6.9.3 6.10.3 6.11.2 6.11.3 6.12.0"
  QT_VERSIONS_SHORT: "pyqt5 6.8.3 6.11.2 6.12.0"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  HEADER: "| arm | error | walk s (med) | nodes (med) | truncated | app RSS MB base > after walks > idle | driver RSS MB | big walk s / nodes / app RSS | errors |\n|---|---|---|---|---|---|---|---|---|"

jobs:
  census:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Install Qt-looking apps
        run: |
          for cask in anki qgis musescore obs wireshark-app calibre telegram-desktop krita qt-creator keepassxc qbittorrent \
            db-browser-for-sqlite shotcut kdenlive mixxx openscad ultimaker-cura zoom freecad; do
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask --no-progress "$cask" >/dev/null 2>&1 && echo "ok $cask" || echo "FAILED $cask"
          done
      - name: Qt version each app ships
        run: |
          { echo "| app | Qt |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for app in /Applications/*.app; do
            lib=$(find "$app" -type f \( -path '*QtCore.framework/Versions/*/QtCore' -o -name 'libQt*Core*.dylib' \) 2>/dev/null | head -1)
            [ -n "$lib" ] || continue
            ver=$(otool -L "$lib" | sed -n '2p' | grep -oE 'current version [0-9.]+' | awk '{print $3}')
            echo "| $(basename "$app" .app) | $ver |" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  macos:
    runs-on: macos-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Qt builds, FreeCAD, driver source
        run: |
          set -euo pipefail
          brew install ffmpeg jq >/dev/null 2>&1 || true
          pip install -q psutil
          for v in $QT_VERSIONS; do
            uv venv -q --python 3.12 "/tmp/qt-$v"
            if [ "$v" = pyqt5 ]; then pkg=PyQt5; else pkg="PySide6==$v"; fi
            uv pip install -q --python "/tmp/qt-$v/bin/python" psutil "$pkg" || echo "no wheel for $v"
          done
          for name in FreeCAD:"$FREECAD" FreeCADWeekly:"$FREECAD_WEEKLY"; do
            curl -fsSL -o /tmp/fc.dmg "${name#*:}"
            mnt=$(hdiutil attach -nobrowse -readonly /tmp/fc.dmg | grep -o '/Volumes/.*' | head -1)
            cp -R "$mnt"/*.app "/Applications/${name%%:*}.app" && hdiutil detach "$mnt" >/dev/null
            xattr -dr com.apple.quarantine "/Applications/${name%%:*}.app" || true
            otool -L "$(find "/Applications/${name%%:*}.app" -name 'libQt6Core*.dylib' -type f | head -1)" | sed -n '2p'
          done
          src="$RUNNER_TEMP/src"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/trycua/cua "$src"
          git -C "$src" checkout --quiet --force "$DRIVER_SHA"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - name: Bootstrap the driver, then churn each Qt with and without walks
        env:
          CUA_E2E_INTERNAL_LANE: native
          AB_PROBE: ${{ github.workspace }}/ab/heavy_apps.py
          AB_APP: ${{ github.workspace }}/ab/qt_churn.py
          AB_CHURN: ${{ github.workspace }}/ab/churn.py
          AB_OUT: ${{ github.workspace }}/ab-results
        run: |
          set -euo pipefail
          script="$SRC/scripts/ci/macos/ab-run.sh"
          sed '/^mark_phase "matrix-/,$d' "$SRC/scripts/ci/macos/run-hosted-rust-e2e.sh" > "$script"
          cat >> "$script" <<'EOS'
          mark_phase "ab-qt-matrix"
          mkdir -p "${AB_OUT}"
          echo -e "${HEADER}" >> "${GITHUB_STEP_SUMMARY}"
          probe() { /usr/bin/perl -e 'alarm shift; exec @ARGV' 600 python3 -u "${AB_PROBE}" "${DAEMON_SOCKET}" "$@" || echo "probe $1 exit $?"; pkill -9 -f qt_churn.py || true; pkill -9 -f 'FreeCAD.*\.app' || true; sleep 3; }
          for v in ${QT_VERSIONS}; do
            [ -x "/tmp/qt-$v/bin/python" ] || continue
            for t in 1 2; do AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=20 probe "qt-$v-walks-t$t" "/tmp/qt-$v/bin/python ${AB_APP}" qt_churn; done
          done
          for v in 6.8.3 6.11.2; do AB_WALKS=0 AB_BIG_WALKS=0 AB_IDLE_S=60 probe "qt-$v-control" "/tmp/qt-$v/bin/python ${AB_APP}" qt_churn; done
          for t in 1 2 3; do
            AB_WALKS=0 AB_BIG_WALKS=0 AB_IDLE_S=90 probe "freecad-1.1.4-control-t$t" "/Applications/FreeCAD.app/Contents/MacOS/FreeCAD ${AB_CHURN}" 'FreeCAD.app'
            AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=30 probe "freecad-1.1.4-walks-t$t" "/Applications/FreeCAD.app/Contents/MacOS/FreeCAD ${AB_CHURN}" 'FreeCAD.app'
            AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=30 probe "freecad-weekly-walks-t$t" "/Applications/FreeCADWeekly.app/Contents/MacOS/FreeCAD ${AB_CHURN}" 'FreeCADWeekly.app'
          done
          mkdir -p "${AB_OUT}/crash" && cp ~/Library/Logs/DiagnosticReports/*.ips "${AB_OUT}/crash/" 2>/dev/null || true
          ls "${AB_OUT}/crash"
          kill "${WATCHDOG_PID}" >/dev/null 2>&1 || true
          exit 0
          EOS
          echo "scripts/ci/macos/ab-run.sh" >> "$SRC/.git/info/exclude"
          cd "$SRC"
          GITHUB_EVENT_NAME=workflow_dispatch \
            CUA_E2E_SOURCE_SHA="$DRIVER_SHA" CUA_E2E_WORKFLOW_SHA="$DRIVER_SHA" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            bash "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-matrix-macos
          path: ab-results
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Desktop and Qt builds
        run: |
          apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3)
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 at-spi2-core xfce4 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libfontconfig1 libdbus-1-3
          pip install -q psutil "cua-driver==0.58.1"
          for v in $QT_VERSIONS_SHORT; do
            uv venv -q --python 3.12 "/tmp/qt-$v"
            if [ "$v" = pyqt5 ]; then pkg=PyQt5; else pkg="PySide6==$v"; fi
            uv pip install -q --python "/tmp/qt-$v/bin/python" psutil "$pkg" || echo "no wheel for $v"
          done
      - name: Churn each Qt under walks
        env:
          DISPLAY: ":99"
        run: |
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp &
          for _ in $(seq 20); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.5; done
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          for _ in $(seq 30); do xwininfo -root -tree 2>/dev/null | grep -q xfdesktop && break; sleep 1; done
          mkdir -p ab-results
          cua-driver serve --socket /tmp/ab.sock > ab-results/driver.log 2>&1 &
          for _ in $(seq 30); do [ -S /tmp/ab.sock ] && break; sleep 0.5; done
          echo -e "$HEADER" >> "$GITHUB_STEP_SUMMARY"
          for v in $QT_VERSIONS_SHORT; do
            for t in 1 2; do AB_WALKS=60 AB_BIG_WALKS=0 AB_IDLE_S=20 timeout 600 python ab/heavy_apps.py /tmp/ab.sock "qt-$v-walks-t$t" "/tmp/qt-$v/bin/python ab/qt_churn.py" qt_churn || true; pkill -9 -f qt_churn.py || true; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-matrix-linux
          path: ab-results

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Qt builds
        shell: bash
        run: |
          pip install -q psutil "cua-driver==0.58.1"
          for v in $QT_VERSIONS_SHORT; do
            uv venv -q --python 3.12 "$RUNNER_TEMP/qt-$v"
            if [ "$v" = pyqt5 ]; then pkg=PyQt5; else pkg="PySide6==$v"; fi
            uv pip install -q --python "$RUNNER_TEMP/qt-$v/Scripts/python.exe" psutil "$pkg" || echo "no wheel for $v"
          done
      - name: Churn each Qt under walks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab-results | Out-Null
          $pipe = '\\.\pipe\ab-heavy'
          Start-Process cua-driver -ArgumentList 'serve', '--socket', $pipe -RedirectStandardError ab-results\driver.log -RedirectStandardOutput ab-results\driver.out -WindowStyle Hidden
          Start-Sleep 5
          ($env:HEADER -replace '\\n', "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $env:AB_WALKS = "60"; $env:AB_BIG_WALKS = "0"; $env:AB_IDLE_S = "20"
          foreach ($v in $env:QT_VERSIONS_SHORT.Split(' ')) {
            foreach ($t in 1..2) {
              python ab/heavy_apps.py $pipe "qt-$v-walks-t$t" "`"$env:RUNNER_TEMP\qt-$v\Scripts\python.exe`" ab\qt_churn.py" qt_churn
              Get-CimInstance Win32_Process -Filter "CommandLine like '%qt_churn%'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-matrix-windows
          path: ab-results
